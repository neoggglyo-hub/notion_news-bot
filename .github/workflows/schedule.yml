name: Daily News to Notion

on:
  schedule:
    # 깃허브 트래픽을 피하기 위해 22시 17분(한국 시간 오전 7시 17분)으로 설정!
    - cron: '17 22 * * 0-4'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 설치하기
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 파이썬 패키지 설치
        run: |
          pip install requests feedparser pytz

      - name: 파이썬 뉴스봇 실행!
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
