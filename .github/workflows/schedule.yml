name: Daily News to Notion

on:
  schedule:
    # 매일(월~일) 한국 시간 오전 4시 17분에 실행 (UTC 기준 19시 17분)
    - cron: '17 19 * * *'
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 설치하기
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요한 파이썬 패키지 설치
        run: |
          pip install requests feedparser pytz

      - name: 파이썬 뉴스봇 실행!
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py
